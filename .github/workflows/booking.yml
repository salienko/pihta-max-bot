name: Booking checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pihta_test
          POSTGRES_PASSWORD: disposable_test_password
          POSTGRES_DB: pihta_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pihta_test -d pihta_tests"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v
        env:
          TEST_DATABASE_URL: postgresql://pihta_test:disposable_test_password@localhost:5432/pihta_tests
